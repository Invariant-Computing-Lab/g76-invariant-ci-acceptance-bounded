[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "invariant-v7-g76"
version = "0.1.1"
description = "Bounded offline G76 validation prototype; not recovered upstream software"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
invariant-g76 = "invariant_v7_g76:main"

[tool.setuptools]
py-modules = ["invariant_v7_g76"]
